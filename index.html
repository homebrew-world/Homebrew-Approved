<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Homebrew-Approved</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Homebrew-Approved: Share and showcase approved tabletop RPG homebrew content." />
  <meta property="og:title" content="Homebrew-Approved" />
  <meta property="og:description" content="Share and showcase approved tabletop RPG homebrew content." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://example.com/social-card.png" />
  <link rel="icon" href="favicon.ico" />
  <style>
    body {
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #0b0c0f;
      color: #e7e7ea;
    }
    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 8px;
    }
    .cta {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 14px;
      border: 1px solid #444;
      border-radius: 10px;
      text-decoration: none;
      color: #e7e7ea;
    }
    .grid {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }
    .card {
      padding: 16px;
      border: 1px solid #2b2b33;
      border-radius: 12px;
      background: #12131a;
    }
    a {
      color: #7fb3ff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Homebrew-Approved</h1>
    <p>A curated, open-source project for sharing approved tabletop RPG homebrew content. Build, share, and collaborate.</p>
    <a class="cta" href="https://github.com/yourusername/Homebrew-Approved">View on GitHub</a>
    <section class="grid">
      <div class="card">
        <strong>Install / Use</strong><br>
        <code>npm i homebrew-approved</code> (or see docs)
      </div>
      <div class="card">
        <strong>Docs</strong><br>
        <a href="./docs/">Read the docs →</a>
      </div>
      <div class="card">
        <strong>License</strong><br>
        MIT (or your chosen license)
      </div>
    </section>
  </main>
</body>
</html>
